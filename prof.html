<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Manutenção Residencial</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        p.subtitle {
            margin-bottom: 20px;
            color: #64748b;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--primary-color);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafafa;
        }

        .service-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, border-color 0.2s;
        }

        .service-item:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .service-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .service-item span {
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .counter {
            font-weight: 600;
            color: #475569;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <p class="subtitle">Selecione abaixo todos os serviços necessários para a sua residência.</p>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Pesquisar serviço (ex: torneira, vazamento, tomada)...">

    <!-- Formulário apontado para FormSubmit -->
    <form id="serviceForm" action="https://formsubmit.co/carlos.infohouse@gmail.com" method="POST">
        <!-- Configurações do FormSubmit -->
        <input type="hidden" name="_subject" value="formulário preenchido">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        
        <!-- Campo oculto onde a lista formatada TXT será inserida -->
        <input type="hidden" name="relatorio_txt" id="relatorioTxtInput">

        <div class="services-grid" id="servicesGrid">
            <!-- As checkboxes serão inseridas dinamicamente via JavaScript -->
        </div>
    </form>
</div>

<div class="footer-bar">
    <div class="counter" id="selectedCount">0 serviços selecionados</div>

    // Renderiza os serviços na tela
    function renderServices() {
        listaServicos.forEach((servico, index) => {
            const itemDiv = document.createElement('label');
            itemDiv.className = 'service-item';
            itemDiv.innerHTML = `
                <input type="checkbox" name="servicos_selecionados" value="${servico}" onchange="updateCounter()">
                <span>${servico}</span>
            `;
            servicesGrid.appendChild(itemDiv);
        });
    }

    // Atualiza o contador de marcados
    function updateCounter() {
        const checkedCount = document.querySelectorAll('input[name="servicos_selecionados"]:checked').length;
        container('selectedCount').innerText = `${checkedCount} serviço(s) selecionado(s)`;
    }

    // Filtro de busca em tempo real
    container('searchInput').addEventListener('input', function(e) {
        const filter = e.target.value.toLowerCase();
        const items = servicesGrid.getElementsByClassName('service-item');
        
        Array.from(items).forEach(item => {
            const text = item.textContent.toLowerCase();
            if (text.includes(filter)) {
                item.style.display = "flex";
            } else {
                item.style.display = "none";
            }
        });
    });

    // Função para gerar o arquivo TXT localmente e enviar o formulário
    function processAndSubmit() {
        const checkboxes = document.querySelectorAll('input[name="servicos_selecionados"]:checked');
        
        if (checkboxes.length === 0) {
            alert('Por favor, selecione pelo menos um serviço antes de enviar.');
            return;
        }

        // Construção do conteúdo em texto puro (.txt)
        const dataAtual = new Date().toLocaleString('pt-BR');
        let txtContent = `=================================================\n`;
        txtContent += `    FORMULÁRIO PREENCHIDO - SERVIÇOS DE MANUTENÇÃO\n`;
        txtContent += `    Data de Envio: ${dataAtual}\n`;
        txtContent += `=================================================\n\n`;
        txtContent += `SERVIÇOS SELECIONADOS (${checkboxes.length}):\n\n`;

        checkboxes.forEach((cb, i) => {
            txtContent += `${i + 1}. [X] ${cb.value}\n`;
        });

        txtContent += `\n=================================================\n`;

        // 1. Preenche o campo oculto do formulário com o texto formatado para o e-mail
        container('relatorioTxtInput').value = txtContent;

        // 2. Faz o download do arquivo .txt para o usuário
        const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `servicos_selecionados_${Date.now()}.txt`;
        link.click();

        // 3. Submete o formulário por e-mail via FormSubmit
        container('serviceForm').submit();
    }

    // Inicialização
    renderServices();
