<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resolve 1 Dia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <!-- HEADER FIXO -->
        <header>
            <div class="header-top">
                <h1 class="header-title">Resolve 1 Dia</h1>
                <img src="logo.png" alt="Logo" class="header-logo">
            </div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Busque um serviço..." autocomplete="off">
                <div id="search-suggestions"></div>
            </div>
        </header>

        <!-- TELA 1: CATEGORIAS -->
        <main id="view-categories" class="view active">
            
            <!-- SEÇÃO: COMO FUNCIONA -->
            <section class="how-it-works-card">
                <h3 class="how-it-works-title">Como Funciona</h3>
                <div class="how-it-works-body">
                    <!-- Esquerda: Imagem -->
                    <div class="how-it-works-left">
                        <img src="logo.png" alt="Logo Resolve 1 Dia" class="how-it-works-img">
                    </div>
                    
                    <!-- Direita: Passos Verticais -->
                    <div class="how-it-works-right">
                        <div class="step-item">
                            <div class="step-badge">1</div>
                            <div class="step-content">
                                <strong>Selecione</strong> o serviço desejado
                            </div>
                        </div>
                        <div class="step-line"></div>
                        <div class="step-item">
                            <div class="step-badge">2</div>
                            <div class="step-content">
                                <strong>Solicite</strong> seu orçamento rápido
                            </div>
                        </div>
                        <div class="step-line"></div>
                        <div class="step-item">
                            <div class="step-badge">3</div>
                            <div class="step-content">
                                <strong>Agende</strong> seu serviço e pronto!
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <h2 class="section-subtitle">Selecione o profissional:</h2>
            <div class="grid" id="categories-grid">
                <!-- Gerado dinamicamente via JS -->
            </div>
        </main>

        <!-- TELA 2: LISTA DE SERVIÇOS DA CATEGORIA -->
        <main id="view-service-list" class="view">
            <div class="view-header">
                <h2 class="view-title" id="list-category-title">Categoria</h2>
                <button class="close-btn" id="btn-close-list" aria-label="Fechar">✕</button>
            </div>
            <ul class="service-list" id="services-ul">
                <!-- Gerado dinamicamente via JS -->
            </ul>
        </main>

        <!-- TELA 3: DETALHE DO SERVIÇO -->
        <main id="view-service-detail" class="view">
            <div class="detail-card">
                <button class="close-btn" id="btn-close-detail" aria-label="Fechar">✕</button>
                <div class="detail-category" id="detail-category">Categoria</div>
                <h1 class="detail-title" id="detail-title">Nome do Serviço</h1>
                <p class="detail-description" id="detail-description">Explicação do serviço...</p>
                <a href="#" id="btn-whatsapp" class="btn-whatsapp" target="_blank">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                    </svg>
                    Solicitar Orçamento
                </a>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
